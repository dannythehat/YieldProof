name: YieldProof SEO Master Research

on:
  push:
    branches:
      - "research/seo-master"
    paths-ignore:
      - "research-output/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yieldproof-seo-master
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run comprehensive DataForSEO research
        run: node scripts/seo-master-research.mjs
        env:
          DATAFORSEO_BASIC_AUTH: ${{ secrets.DATAFORSEO_BASIC_AUTH }}
      - name: Commit sanitised research output
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-output/yieldproof-seo-master.json research-output/yieldproof-seo-cost.json
          git commit -m "Record YieldProof SEO master research [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: yieldproof-seo-master
          path: research-output/
          retention-days: 30
