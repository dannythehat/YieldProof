name: GoldThinker DataForSEO Real Keyword Research (isolated)
on:
  push:
    branches:
      - research/goldthinker-keywords-20261016
    paths:
      - scripts/goldthinker-dataforseo-research.mjs
      - .github/workflows/goldthinker-dataforseo-research.yml
permissions:
  contents: read
jobs:
  keyword-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Measure actual Google keyword search demand (USA and UK) using existing secret
        env:
          DATAFORSEO_BASIC_AUTH: ${{ secrets.DATAFORSEO_BASIC_AUTH }}
        run: node scripts/goldthinker-dataforseo-research.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goldthinker-dataforseo-actual-us-uk-keywords
          path: goldthinker-seo-output/
          retention-days: 90
          if-no-files-found: warn
