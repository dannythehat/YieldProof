name: DataForSEO Test

on:
  push:
    branches:
      - "research/dataforseo-test"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test DataForSEO authentication and paid keyword access
        run: node scripts/dataforseo-test.mjs
        env:
          DATAFORSEO_BASIC_AUTH: ${{ secrets.DATAFORSEO_BASIC_AUTH }}
