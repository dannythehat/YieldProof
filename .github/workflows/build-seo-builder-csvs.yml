name: Build SEO Builder CSVs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-seo-builder-csvs.mjs'
      - '.github/workflows/build-seo-builder-csvs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build CSV datasets
        run: node scripts/build-seo-builder-csvs.mjs
      - name: Commit generated CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-seo-builder/*.csv
          git commit -m "Generate YieldProof SEO master builder CSVs [skip ci]" || exit 0
          git push
